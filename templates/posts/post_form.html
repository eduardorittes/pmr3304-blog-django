{% extends 'base.html' %}

{% block content %}

<h2>{{ titulo }}</h2>

<form method="post">

    {% csrf_token %}

    <label>Título:</label>
    <input type="text" name="title" value="{{ post.title|default:'' }}">

    <label>Conteúdo (HTML):</label>
    <textarea name="content" rows="10">{{ post.content|default:'' }}</textarea>

    <button type="submit">Salvar</button>

</form>

<br>

<a href="{% url 'post_list' %}">Cancelar</a>

{% endblock %}
