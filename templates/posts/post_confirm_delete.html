{% extends 'base.html' %}

{% block content %}

<h2>Excluir publicação</h2>

<p>Deseja realmente excluir "{{ post.title }}"?</p>

<form method="post">

    {% csrf_token %}

    <button type="submit">Sim, excluir</button>

</form>

<br>

<a href="{% url 'post_detail' post.pk %}">Cancelar</a>

{% endblock %}
