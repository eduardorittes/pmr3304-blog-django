{% extends 'base.html' %}

{% block content %}

<h2>Entrar</h2>

{% if form.errors %}
    <p>Usuario ou senha incorretos.</p>
{% endif %}

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Entrar</button>

    <input type="hidden" name="next" value="{{ next }}">

</form>

{% endblock %}
