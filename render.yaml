databases:
  - name: pmr3304-db
    plan: free
    databaseName: pmr3304
    user: pmr3304

services:
  - type: web
    name: pmr3304-blog-django
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pmr3304-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: PYTHON_VERSION
        value: 3.14.10